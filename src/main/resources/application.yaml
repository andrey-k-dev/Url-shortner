spring:
  application:
    name: auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barber_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    root: INFO
    com.notifications.notifications: DEBUG
    org.springframework.web: DEBUG

shortener:
  short-code-length: ${SHORT_CODE_LENGTH:7}
  short-link-life-time-days: ${SHORT_LINK_LIFE_TIME_DAYS:7}
  base-url: ${BASE_URL:http://localhost:8080}
